# =========================================================
# Mihomo / Clash Meta 现代极简配置文件 (完整版)
# =========================================================

# 1. 基础通用设置
port: 7890
socks-port: 7891
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

# 2. 进阶 Fake-IP + 零泄露 DNS 配置
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  cache-algorithm: arc

  # 预解析 DNS（仅用于解析 DoH/DoT 域名及节点域名）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 专门用于解析代理节点域名的 DNS
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 默认主 DNS
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alibaba.com/dns-query

  # 域名策略精准分流
  nameserver-policy:
    'geosite:cn,private':
      - https://doh.pub/dns-query
      - https://dns.alibaba.com/dns-query
    'geosite:gfw,geolocation-!cn':
      - 'https://1.1.1.1/dns-query#Proxy'
      - 'https://dns.google/dns-query#Proxy'

  # Fake-IP 过滤名单（跳过 Fake-IP 直接返回真实 IP）
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'time.*.com'
    - 'ntp.*.com'
    - 'geosite:cn'
    - 'geosite:category-games@cn'

# 3. 策略组配置
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      # 此处填入你的机场节点名称

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      # 此处填入你的机场节点名称

# 4. 远程规则集配置 (Rule Provider)
rule-providers:
  BanAD:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
    path: ./ruleset/BanAD.txt
    interval: 86400

# 5. 精简分流规则 (依次向下匹配)
rules:
  # 1. 广告拦截
  - RULE-SET,BanAD,REJECT
  # 2. 国内域名与 IP 直连
  - GEOSITE,cn,DIRECT
  - GEOIP,cn,DIRECT
  # 3. 兜底匹配
  - MATCH,🚀 节点选择
